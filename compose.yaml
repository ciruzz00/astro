name: astro

services:
  # Build, test and lint. Never loads .env, so real API keys cannot reach
  # tests or tool output.
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    image: astro-dev:local
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/home/dev/go/pkg/mod
      - gobuild:/home/dev/.cache/go-build
      - data:/data

  # Interactive use of astro (make try / make run), with the keys from .env.
  cli:
    extends: dev
    env_file:
      - path: .env
        required: false

  # REST API (make serve), published on the host loopback only.
  api:
    extends: cli
    command: sh -c 'go build -trimpath -o /home/dev/bin/astro ./cmd/astro && exec /home/dev/bin/astro serve --addr 0.0.0.0:8080 --allow-remote'
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  gomod:
    name: astro-gomod
  gobuild:
    name: astro-gobuild
  data:
    name: astro-data
