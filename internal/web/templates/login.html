{{define "content"}}
<section class="login">
  <div class="login-card card">
    <div class="login-brand"><img src="{{asset "favicon.svg"}}" alt="" width="44" height="44">
      <div><h1>astro</h1><p class="muted">{{t "Threat intelligence search engine"}}</p></div></div>
    {{with .Data}}<div class="flash flash-error" role="alert">{{.}}</div>{{end}}
    <form method="post" action="/login" hx-boost="false">
      <label for="token">{{t "Access token"}}</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus
             placeholder="astro_…" pattern="astro_[A-Za-z0-9_\-]{43}">
      <button class="btn btn-primary btn-block" type="submit">{{t "Sign in"}}</button>
    </form>
    <p class="hint">{{t "Create a token on the server with"}} <code>astro token create web</code> {{t "(or"}} <code>make token NAME=web</code>).</p>
  </div>
  {{template "lang-switch" .}}
</section>
{{end}}
